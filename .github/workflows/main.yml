```yaml
name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -e

          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== COPYING FILES ====="

          cp .github/workflows/buildozer.spec ./buildozer.spec
          cp .github/workflows/main.py ./main.py
          cp .github/workflows/requirements.txt ./requirements.txt

          echo "===== PROJECT FILES ====="
          ls -la

          echo "===== VERIFY FILES ====="

          test -f buildozer.spec
          test -f main.py
          test -f requirements.txt

          echo "buildozer.spec OK"
          echo "main.py OK"
          echo "requirements.txt OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-dev \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake

      - name: Install Python dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          pip install buildozer cython

          pip install -r requirements.txt

      - name: Verify Buildozer
        shell: bash
        run: |
          echo "===== BUILDOZER ====="
          buildozer --version

          echo "===== BUILD DIRECTORY ====="
          pwd

          echo "===== BUILDOZER SPEC ====="
          head -80 buildozer.spec

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "===== START BUILD ====="

          buildozer android debug

          echo "===== BUILD FINISHED ====="

      - name: Find APK
        if: success()
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YouDownlaoder-Android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
```
